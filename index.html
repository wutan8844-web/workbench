<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人工作台</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1f2329; --sub:#8a8f99;
  --primary:#3b6ef6; --primary-soft:#eaf0fe; --danger:#f5483b; --ok:#18a058;
  --warn:#f0a020; --line:#eef0f4; --radius:16px;
  --shadow:0 2px 12px rgba(30,40,80,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:inherit}

/* ---------- 布局 ---------- */
#app{display:flex;min-height:100vh}
/* 侧边栏（始终显示，参考截图样式） */
.sidebar{width:92px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;position:sticky;top:0;height:100vh;flex-shrink:0;z-index:20}
.sidebar .logo{font-size:26px;margin-bottom:16px}
.nav-item{width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;color:var(--sub);font-size:11px;margin-bottom:6px;transition:.15s}
.nav-item .ico{font-size:23px;line-height:1}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
/* 主内容 */
.main{flex:1;min-width:0;padding:18px 18px 90px;max-width:820px;margin:0 auto;width:100%}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.page-head h1{font-size:20px}
.page-head .sub{color:var(--sub);font-size:12px;margin-top:2px}
/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-title h3{font-size:15px}
.card-title .more{font-size:12px;color:var(--primary)}
/* 首页模块卡片 */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.dash-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px}
.dash-card:active{transform:scale(.98)}
.dash-card .dc-head{display:flex;align-items:center;gap:8px}
.dash-card .dc-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.dash-card .dc-name{font-weight:600;font-size:14px}
.dash-card .dc-body{font-size:12px;color:var(--sub);line-height:1.6;min-height:38px}
.dash-card .dc-foot{font-size:11px;color:var(--primary);font-weight:500}
/* 通用控件 */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;font-size:13px;background:var(--primary-soft);color:var(--primary);font-weight:500}
.btn.primary{background:var(--primary);color:#fff}
.btn.ghost{background:#f3f4f6;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{background:#fdecea;color:var(--danger)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:#f3f4f6;color:var(--sub)}
.tag.p0{background:#fdecea;color:var(--danger)}
.tag.p1{background:#fff7e6;color:var(--warn)}
.tag.p2{background:#e8f7ef;color:var(--ok)}
.tag.blue{background:var(--primary-soft);color:var(--primary)}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;outline:none}
input:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:70px}
.form-row{margin-bottom:10px}
.form-row label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:24px 0}
.list-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid #d4d7de;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;font-size:12px;color:#fff;transition:.15s}
.checkbox.done{background:var(--ok);border-color:var(--ok)}
.checkbox.doing{background:var(--warn);border-color:var(--warn)}
/* 弹层 */
.modal-mask{position:fixed;inset:0;background:rgba(20,25,40,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin-bottom:14px;font-size:16px}
.modal .m-actions{display:flex;gap:10px;margin-top:14px}
.modal .m-actions .btn{flex:1;justify-content:center;padding:11px}
@media(min-width:640px){.modal-mask{align-items:center}.modal{border-radius:20px}}
/* 分段选择器 */
.seg{display:flex;background:#f3f4f6;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:12px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* 底部 Tab（已停用，统一使用左侧导航） */
.tabbar{display:none!important}
/* 进度条 */
.progress{height:8px;background:#f0f1f5;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#5b8bff,#3b6ef6);border-radius:99px}
/* 单词卡 */
.word-card{background:linear-gradient(135deg,#f7f9ff,#eef3ff);border-radius:12px;padding:14px;margin-bottom:10px}
.word-card .w-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.word-card .w-word{font-size:18px;font-weight:700}
.word-card .w-phon{color:var(--sub);font-size:12px}
.word-card .w-def{font-size:13px;margin:6px 0}
.word-card .w-eg{font-size:12px;color:var(--sub);font-style:italic}
/* 基金 */
.fund-up{color:var(--danger);font-weight:600}
.fund-down{color:var(--ok);font-weight:600}
.chat-log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding:4px 0}
.chat-bubble{padding:9px 13px;border-radius:14px;font-size:13px;max-width:85%;line-height:1.5}
.chat-bubble.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-bubble.bot{align-self:flex-start;background:#f3f4f6;border-bottom-left-radius:4px}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1}
/* 图表 */
.chart-box{width:100%;overflow-x:auto}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
/* 新闻 */
.news-item{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.news-item:last-child{border-bottom:none}
.news-item .n-title{font-size:14px;font-weight:600;line-height:1.5}
.news-item .n-meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:11px;color:var(--sub)}
.hot{color:#fff;background:linear-gradient(90deg,#ff7a45,#f5483b);border-radius:6px;padding:1px 7px;font-size:11px}
/* 响应式：移动端收窄侧边栏但保留 */
@media(max-width:640px){
  .sidebar{width:64px;padding:12px 0}
  .sidebar .logo{font-size:20px;margin-bottom:12px}
  .nav-item{width:52px;padding:8px 2px;font-size:10px;border-radius:12px;margin-bottom:4px;gap:3px}
  .nav-item .ico{font-size:19px}
  .main{padding:14px 12px 30px}
  .page-head h1{font-size:18px}
}
.back-btn{display:none}
@media(max-width:640px){
  .back-btn{display:inline-flex;align-items:center;color:var(--sub);font-size:13px;margin-bottom:6px}
}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:#f8f9fc;border-radius:12px;padding:12px;text-align:center}
.stat .s-num{font-size:18px;font-weight:700}
.stat .s-label{font-size:11px;color:var(--sub);margin-top:2px}
.date-nav{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px}
.date-nav button{width:32px;height:32px;border-radius:10px;background:#f3f4f6;font-size:14px}
.date-nav .d{font-weight:600;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
  <nav class="tabbar"><div class="tabs" id="tabbar"></div></nav>
</div>

<script>
/* ================= 数据层 ================= */
const DB_KEY = 'workbench_v1';
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { const x=new Date(d); return `${x.getMonth()+1}月${x.getDate()}日`; };
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

function loadDB(){
  let db = {};
  try{ db = JSON.parse(localStorage.getItem(DB_KEY)) || {}; }catch(e){}
  return Object.assign({
    tasks:[],           // {id,title,pri:0/1/2,status:'todo'|'doing'|'done',date}
    reviews:{},         // {date:{summary,gain,lack,plan}}
    memos:[],           // {id,title,content,tags:[],updated}
    words:{},           // {date:[{w,phon,def,eg,mastered}]}
    codeNotes:[],       // {id,cat,title,content,date}
    codePlan:[],        // {id,cat,topic,done,date}
    funds:[],           // {id,code,name,nav,prevNav,cost,shares}
    fundChat:[],        // {id,date,role,text}
    finance:[],         // {id,type:'in'|'out',amount,cat,note,date}
    newsCache:null      // {date,items:[...]}
  }, db);
}
let db = loadDB();
const save = () => localStorage.setItem(DB_KEY, JSON.stringify(db));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* 版本迁移：清空旧词缓存 + 预置小白代码学习路径 */
/* 代码学习案例库（小白入门，每条含大白话讲解 + 示例代码） */
const LESSONS = [
{cat:'前端',topic:'认识网页：HTML 是骨架、CSS 是皮肤、JS 是动作',
 lesson:{explain:`一个网页由三种语言搭成。HTML 决定"有什么"（骨架），比如标题、段落、按钮；CSS 决定"长什么样"（皮肤），比如颜色、大小、位置；JavaScript 决定"能干什么"（动作），比如点按钮弹个提示。\n三者关系：HTML 是毛坯房，CSS 是装修，JS 是电器。`,code:`<!-- HTML：骨架 -->
<h1>你好</h1>
<button id="btn">点我</button>

/* CSS：皮肤 */
h1 { color: red; }

// JS：动作
document.getElementById("btn").onclick = () => alert("被点了");`}},
{cat:'前端',topic:'HTML 常用标签：标题/段落/链接/图片/列表',
 lesson:{explain:`标签就是用尖括号包起来的"盒子"，成对出现。h1~h6 是标题（数字越小字越大），p 是段落，a href 是链接，img src 是图片，ul/li 是无序列表。记住：内容放在开标签和闭标签之间。`,code:`<h1>我的主页</h1>
<p>这是一段介绍文字。</p>
<a href="https://baidu.com">点我跳转百度</a>
<img src="cat.jpg" alt="一只猫">
<ul>
  <li>苹果</li>
  <li>香蕉</li>
</ul>`}},
{cat:'前端',topic:'CSS 入门：选择器与给元素改颜色、字号',
 lesson:{explain:`CSS 靠"选择器"找到元素，再用大括号改样式。p 选择所有段落，.box 选择 class="box" 的元素，#title 选择 id="title" 的元素。color 改文字颜色，font-size 改字号。写法：选择器 { 属性: 值; }。`,code:`p { color: gray; }              /* 所有段落变灰 */
.title { color: red; font-size: 24px; }   /* 大标题红色 */
#btn { background: blue; color: white; }  /* 按钮蓝底白字 */`}},
{cat:'前端',topic:'CSS 盒模型：内容、内边距、边框、外边距',
 lesson:{explain:`每个元素都是一个"盒子"，从内到外四层：content（内容）→ padding（内边距，内容和边框的间距）→ border（边框）→ margin（外边距，盒子和其他元素的间距）。想象一幅画：画是 content，画框里的衬纸是 padding，画框是 border，画框和墙的距离是 margin。`,code:`.box {
  width: 100px;              /* 内容宽 */
  padding: 10px;             /* 内边距 */
  border: 2px solid black;   /* 边框 */
  margin: 20px;              /* 外边距 */
}
/* 实际占地宽 = 100 + 10*2 + 2*2 = 124px（不含 margin）*/`}},
{cat:'前端',topic:'JavaScript 变量：let / const 与数据类型',
 lesson:{explain:`变量就是"装数据的盒子"。用 let 声明可以改的，const 声明不能改的。常见数据类型：数字、字符串（用引号包起来）、布尔（true/false）。等号是"赋值"不是"相等"。`,code:`let age = 18;            // 数字
const name = "小明";     // 字符串
let isStudent = true;    // 布尔
age = 19;                // let 可以改
// name = "小红";        // 报错！const 不能改
console.log(name, age);  // 打印：小明 19`}},
{cat:'前端',topic:'JavaScript 条件判断：if...else',
 lesson:{explain:`if 判断"如果满足条件就做A，否则做B"。条件用比较符：> 大于、< 小于、>= 大于等于、=== 等于、!== 不等于。可以串 else if 处理多种情况。`,code:`let score = 75;
if (score >= 90) {
  console.log("优秀");
} else if (score >= 60) {
  console.log("及格");
} else {
  console.log("不及格");
}
// 输出：及格`}},
{cat:'前端',topic:'JavaScript 循环：for 与 while',
 lesson:{explain:`循环让你不用重复写代码。for 适合"重复N次"：括号里三段——起点、条件、每次变化。while 适合"满足条件就一直做"。`,code:`// 打印 1 到 5
for (let i = 1; i <= 5; i++) {
  console.log(i);
}
// while 版
let n = 1;
while (n <= 5) {
  console.log(n);
  n++;
}`}},
{cat:'前端',topic:'JavaScript 函数：定义、参数与返回值',
 lesson:{explain:`函数是"打包好的一段代码"，取个名字，需要时调用。可以接收参数（输入），用 return 返回结果（输出）。好处：写一次，反复用。`,code:`function add(a, b) {
  return a + b;
}
let result = add(3, 5);    // result = 8
console.log(add(10, 20));  // 30

// 箭头函数（更简洁的写法）
const greet = name => "你好，" + name;
console.log(greet("小明"));  // 你好，小明`}},
{cat:'前端',topic:'JavaScript 数组：push/map/filter 常用方法',
 lesson:{explain:`数组是一串按顺序排的数据，用方括号。从 0 开始数（第一个是 [0]）。push 往后加，map 把每个元素变形成新的，filter 筛出符合条件的。`,code:`let nums = [1, 2, 3, 4, 5];
nums.push(6);                          // [1,2,3,4,5,6]
let dbl = nums.map(n => n * 2);        // [2,4,6,8,10,12]
let big = nums.filter(n => n > 3);     // [4,5,6]
console.log(nums[0]);                  // 1`}},
{cat:'前端',topic:'DOM 入门：用 JS 找到元素并修改内容',
 lesson:{explain:`DOM 就是"网页在 JS 里的样子"。用 JS 找到元素（getElementById / querySelector），然后改它的内容（innerText）、样式（style）、或加事件（onclick）。这是让网页"动起来"的关键。`,code:`<!-- HTML -->
<p id="msg">原始文字</p>
<button id="btn">改文字</button>

// JS
let p = document.getElementById("msg");
document.getElementById("btn").onclick = () => {
  p.innerText = "被改过了！";
  p.style.color = "red";
};`}},
{cat:'算法',topic:'什么是时间复杂度（大白话理解 O(n)）',
 lesson:{explain:`时间复杂度衡量"数据变多时，代码变慢多少"。用 O(...) 表示。O(1) 不管多少数据都一样快；O(n) 数据翻倍时间也翻倍（比如遍历一遍）；O(n²) 数据翻倍时间变4倍（比如双层循环）。写题时尽量选 O 小的。`,code:`// O(1)：直接取值，和数据量无关
let first = arr[0];

// O(n)：遍历一遍
for (let i = 0; i < arr.length; i++) {
  console.log(arr[i]);
}

// O(n²)：双层循环，数据多时会很慢
for (let i = 0; i < arr.length; i++) {
  for (let j = 0; j < arr.length; j++) {
    console.log(arr[i] + arr[j]);
  }
}`}},
{cat:'算法',topic:'第一道题：两数之和（暴力法 vs 哈希表）',
 lesson:{explain:`经典入门题：数组里找两个数，加起来等于目标值，返回它们的位置。暴力法：两层循环挨个试（O(n²)）。优化法：用哈希表（对象）记住见过的数，一次遍历搞定（O(n)）。`,code:`// 题目：nums = [2,7,11,15], target = 9 → 返回 [0,1]
function twoSum(nums, target) {
  let map = {};  // 记住"值→位置"
  for (let i = 0; i < nums.length; i++) {
    let need = target - nums[i];
    if (map[need] !== undefined) {
      return [map[need], i];  // 找到了
    }
    map[nums[i]] = i;  // 记住当前数
  }
}
console.log(twoSum([2,7,11,15], 9));  // [0,1]`}},
{cat:'后端',topic:'什么是客户端与服务器？HTTP 请求怎么回事',
 lesson:{explain:`上网就是你（客户端/浏览器）发请求，服务器回数据。HTTP 是双方"说话的格式"。常见请求类型：GET（要数据，比如打开网页）、POST（交数据，比如登录）。状态码：200 成功、404 找不到、500 服务器出错。`,code:`// 用 fetch 发一个 GET 请求
fetch("https://api.example.com/user")
  .then(res => res.json())     // 把响应转成 JSON
  .then(data => console.log(data));

// 发 POST 请求（带数据）
fetch("https://api.example.com/login", {
  method: "POST",
  body: JSON.stringify({ user: "小明", pwd: "123" })
});`}},
{cat:'数据库',topic:'数据库是什么？表、行、列的概念',
 lesson:{explain:`数据库就是"按表格存数据的仓库"。一张表（table）像 Excel 表格，每行（row）是一条记录（比如一个用户），每列（column）是一个字段（比如姓名、年龄）。用 SQL 语言操作：SELECT 查、INSERT 增、UPDATE 改、DELETE 删。`,code:`-- 建一张用户表
CREATE TABLE users (
  id INT,
  name TEXT,
  age INT
);
-- 查所有成年用户
SELECT * FROM users WHERE age >= 18;
-- 加一条记录
INSERT INTO users VALUES (1, "小明", 20);
-- 改
UPDATE users SET age = 21 WHERE name = "小明";`}},
{cat:'工程化',topic:'认识 Git：版本管理与第一次 commit',
 lesson:{explain:`Git 是代码的"时光机"，记录每次改动，随时能回到之前的状态。三个区域：工作区（你改的）、暂存区（准备提交的）、仓库（已记录的）。流程：git add 把改动放暂存区，git commit 正式记录一个版本，git push 推到远程。`,code:`# 配置你的名字（只第一次）
git config --global user.name "你的名字"

# 把当前文件夹变成 Git 仓库
git init

# 查看改了哪些文件
git status

# 把所有改动加入暂存区
git add .

# 提交一个版本，-m 后是说明
git commit -m "第一次提交"

# 查看历史记录
git log`}}
];

/* 升级到带学习案例的版本（保留旧的"已掌握"进度） */
if(!db._seedV5){
  if(!db.codePlan.length || !db.codePlan[0].lesson){
    const oldDone = {}; db.codePlan.forEach(p=>{ if(p.done) oldDone[p.topic]=true; });
    db.codePlan = LESSONS.map(x=>({id:uid(),cat:x.cat,topic:x.topic,done:!!oldDone[x.topic],date:today(),lesson:x.lesson}));
  }

function wordsOf(dateStr){
  if(db.words[dateStr]) return db.words[dateStr];
  // 按日期种子选10个词
  let seed = 0; for(const c of dateStr) seed += c.charCodeAt(0);
  const pool = [...WORD_POOL];
  const picked = [];
  for(let i=0;i<10;i++){
    const idx = (seed * (i+7) + i*13) % pool.length;
    picked.push(Object.assign({mastered:false}, pool.splice(idx,1)[0]));
  }
  db.words[dateStr] = picked; save();
  return picked;
}

  save(); renderTasks();

  const tags = [...new Set(db.memos.flatMap(m=>m.tags))];
  let list = db.memos;
  if(memoTag) list = list.filter(m=>m.tags.includes(memoTag));
  if(memoKw){ const k = memoKw.toLowerCase(); list = list.filter(m=>(m.title+m.content).toLowerCase().includes(k)); }
  main.innerHTML = headHTML('📌 备忘录', `共 ${db.memos.length} 条`) + `
    <div class="card">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input type="text" id="memoSearch" placeholder="🔍 搜索关键词" value="${esc(memoKw)}" style="flex:1">
        <button class="btn primary" onclick="editMemo()">+ 新建</button>
      </div>
      ${tags.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        <span class="tag ${memoTag===''?'blue':''}" style="cursor:pointer" onclick="memoTag='';renderMemo()">全部</span>
        ${tags.map(t=>`<span class="tag ${memoTag===t?'blue':''}" style="cursor:pointer" onclick="memoTag='${esc(t)}';renderMemo()">#${esc(t)}</span>`).join('')}
      </div>`:''}
      <div>${list.length?list.map(m=>`
        <div class="list-item">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px">${esc(m.title)}</div>
            <div style="font-size:12px;color:var(--sub);margin:4px 0;white-space:pre-wrap">${esc(m.content.slice(0,80))}${m.content.length>80?'…':''}</div>
            <div>${m.tags.map(t=>`<span class="tag">#${esc(t)}</span> `).join('')}<span style="font-size:11px;color:var(--sub)">${m.updated}</span></div>
          </div>
          <button class="btn sm ghost" onclick="editMemo('${m.id}')">改</button>
          <button class="btn sm danger" onclick="delMemo('${m.id}')">删</button>
        </div>`).join(''):'<div class="empty">没有匹配的备忘</div>'}
      </div>
    </div>`;
  document.getElementById('memoSearch').addEventListener('input', e=>{ memoKw = e.target.value; renderMemoKeepFocus(); });
}
function renderMemoKeepFocus(){
  renderMemo();
  const el = document.getElementById('memoSearch');
  el.focus(); el.setSelectionRange(el.value.length, el.value.length);
}
function editMemo(id){
  const m = id ? db.memos.find(x=>x.id===id) : {title:'',content:'',tags:[]};
  openModal(id?'编辑备忘':'新建备忘', `
    <div class="form-row"><label>标题</label><input type="text" id="mTitle" value="${esc(m.title)}"></div>
    <div class="form-row"><label>内容</label><textarea id="mContent" style="min-height:110px">${esc(m.content)}</textarea></div>
    <div class="form-row"><label>标签（逗号分隔）</label><input type="text" id="mTags" value="${m.tags.join(',')}" placeholder="工作,灵感,待办"></div>
  `, ()=>{
    const t = gv('mTitle'); if(!t){alert('标题不能为空');return false;}
    const data = {title:t, content:document.getElementById('mContent').value,
      tags:gv('mTags').split(/[,，]/).map(s=>s.trim()).filter(Boolean), updated:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})};
    if(id) Object.assign(m,data); else db.memos.unshift(Object.assign({id:uid()},data));
    save(); renderMemo();
  });
}
function delMemo(id){ if(!confirm('删除这条备忘？')) return; db.memos = db.memos.filter(x=>x.id!==id); save(); renderMemo(); }

/* ---------- 5. 英语学习 ---------- */
function renderEnglish(){
  const d = today();
  const words = wordsOf(d);
  const mastered = words.filter(w=>w.mastered).length;
  // 连续学习天数
  let streak = 0; const dd = new Date();
  while(db.words[dd.toISOString().slice(0,10)]?.some(w=>w.mastered)){ streak++; dd.setDate(dd.getDate()-1); }
  main.innerHTML = headHTML('🔤 每日英语', `${fmtDate(d)} · 今日 10 词`) + `
    <div class="card">
      <div class="stat-row">
        <div class="stat"><div class="s-num">${mastered}/10</div><div class="s-label">今日掌握</div></div>
        <div class="stat"><div class="s-num">${Object.keys(db.words).length}</div><div class="s-label">累计学习天数</div></div>
        <div class="stat"><div class="s-num">${Object.values(db.words).flat().filter(w=>w.mastered).length}</div><div class="s-label">累计掌握单词</div></div>
      </div>
      <div style="margin-top:12px"><div class="progress"><i style="width:${mastered*10}%"></i></div></div>
    </div>
    <div class="card">
      <div class="card-title"><h3>今日单词</h3><span class="more" onclick="reviewMode()">复习未掌握 ›</span></div>
      ${words.map((w,i)=>`
        <div class="word-card" style="${w.mastered?'opacity:.55':''}">
          <div class="w-head"><span class="w-word">${w.w}</span><span class="w-phon">${w.phon}</span>
            ${w.mastered?'<span class="tag p2">已掌握</span>':''}</div>
          <div class="w-def">${w.def}</div>
          <div class="w-eg">📖 ${w.eg}</div>
          <div style="margin-top:8px;text-align:right">
            <button class="btn sm ${w.mastered?'ghost':'primary'}" onclick="toggleWord(${i})">${w.mastered?'取消掌握':'标记已掌握'}</button>
          </div>
        </div>`).join('')}
    </div>`;
}
function toggleWord(i){
  db.words[today()][i].mastered = !db.words[today()][i].mastered;
  save(); renderEnglish();
}
function reviewMode(){
  const list = wordsOf(today()).filter(w=>!w.mastered);
  if(!list.length){ alert('🎉 今日单词全部掌握！'); return; }
  alert('还有 '+list.length+' 个单词待掌握：\n\n'+list.map(w=>w.w+' '+w.def).join('\n'));
}

/* 今日速览：中性措辞，不给买卖建议 */
function fundSummary(funds, total){
  if(!funds.length || !total) return '';
  const notes = [];
  const dayPnl = funds.reduce((s,f)=>s+(f.nav-f.prevNav)*f.shares,0);
  const dayPct = funds.reduce((s,f)=>s+f.prevNav*f.shares,0);
  notes.push(`组合今日估算 <b class="${dayPnl>=0?'fund-up':'fund-down'}">${dayPnl>=0?'+':''}${dayPnl.toFixed(2)}</b>（${dayPct?((dayPnl/dayPct)*100).toFixed(2):'0.00'}%）`);
  funds.forEach(f=>{
    const ret = f.cost? (f.nav-f.cost)/f.cost*100 : 0;
    const w = f.nav*f.shares/total*100;
    if(ret <= -10) notes.push(`${esc(f.name)} 累计 ${ret.toFixed(1)}%，超预警线，保持关注`);
    if(w >= 30) notes.push(`${esc(f.name)} 占比 ${w.toFixed(0)}% 偏重，留意集中度`);
  });
  const obs = funds.filter(f=>f.tag==='观察').length;
  if(obs) notes.push(`${obs} 只处于观察期，暂停定投、继续持有`);
  return `<div style="margin-top:12px;padding:10px 12px;background:#f8f9fc;border-radius:10px;font-size:12px;line-height:1.8;color:var(--sub)">📋 <b style="color:var(--ink)">今日速览</b>：${notes.join('；')}。<span style="font-size:11px">（仅作记录与观察，不构成投资建议）</span></div>`;
}

      cost:+document.getElementById('mCost').value||0,shares:+document.getElementById('mShares').value||0};
    if(id) Object.assign(f,data); else db.funds.push(Object.assign({id:uid()},data));
    save(); renderFund();
  });
}
function delFund(id){ if(!confirm('移除这只基金？')) return; db.funds=db.funds.filter(x=>x.id!==id); save(); renderFund(); }

/* ========== 数据导出 / 导入（完全私有，数据不经过任何公开链接/服务器） ========== */
function exportData(){
  const out = {};
  ['tasks','reviews','memos','codePlan','codeNotes','funds','fundChat','finance'].forEach(k=>out[k]=db[k]);
  out.words = db.words;
  const text = JSON.stringify(out);
  openModal('⬆ 导出数据', `
    <p style="font-size:12px;color:var(--sub);line-height:1.6;margin:0 0 8px">复制下方文本，通过微信「文件传输助手」等方式发到自己手机；在手机端打开本应用 → 首页底部 →「导入数据」→ 粘贴即可。<b>数据全程不经过任何服务器。</b></p>
    <textarea id="exportBox" readonly style="width:100%;height:200px;font-size:11px;font-family:monospace;border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box;resize:vertical">${esc(text)}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn primary" style="flex:1" onclick="copyExport()">复制文本</button>
      <button class="btn ghost" style="flex:1" onclick="downloadExport()">下载 .json 文件</button>
    </div>
  `, ()=>{});
}
function copyExport(){
  const ta = document.getElementById('exportBox');
  ta.select(); ta.setSelectionRange(0, ta.value.length);
  try{ document.execCommand('copy'); alert('已复制到剪贴板，去微信发给手机即可'); }
  catch(e){ alert('复制失败，请手动长按文本框选择并复制'); }
}
function downloadExport(){
  const t = document.getElementById('exportBox').value;
  const blob = new Blob([t], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'workbench-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(){
  openModal('⬇ 导入数据', `
    <p style="font-size:12px;color:var(--sub);line-height:1.6;margin:0 0 8px">粘贴之前导出的文本，或选择备份的 .json 文件。已有数据会保留，按基金代码 / 记录 id 去重合并，不会覆盖你手动录入的内容。</p>
    <textarea id="importBox" placeholder="在此粘贴导出的文本…" style="width:100%;height:160px;font-size:11px;font-family:monospace;border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box;resize:vertical"></textarea>
    <div style="margin-top:8px"><input type="file" id="importFile" accept=".json,.txt" style="font-size:12px"></div>
  `, ()=>{
    const file = document.getElementById('importFile').files[0];
    const doImport = (text)=>{
      try{
        const data = JSON.parse(text);
        ['tasks','reviews','memos','codePlan','codeNotes','fundChat','finance'].forEach(k=>{
          if(!Array.isArray(data[k])) return;
          const ids = new Set((db[k]||[]).map(x=>x.id));
          data[k].forEach(x=>{ if(!ids.has(x.id)) db[k].push(x); });
        });
        if(Array.isArray(data.funds)){
          const codes = new Set(db.funds.map(x=>x.code));
          data.funds.forEach(x=>{ if(x.code && !codes.has(x.code)) db.funds.push(x); });
        }
        if(data.words) Object.assign(db.words, data.words);
        save(); closeModal(); go(curPage);
        alert('导入成功 ✓');
      }catch(e){ alert('解析失败：'+e.message); }
    };
    if(file){ const fr=new FileReader(); fr.onload=()=>doImport(fr.result); fr.readAsText(file); return false; }
    const text = document.getElementById('importBox').value.trim();
    if(!text){ alert('请粘贴文本或选择文件'); return false; }
    doImport(text); return false;
  });
}
/* 天天基金实时估值（JSONP，纯前端跨域） */
function refreshFunds(){
  const hint = document.getElementById('fundHint');
  const list = db.funds.filter(f=>f.code);
  if(!list.length){ hint.textContent = '请先为基金填写 6 位基金代码'; return; }
  hint.textContent = '正在刷新估值…';
  let i = 0;
  function next(){
    if(i >= list.length){
      save(); renderFund();
      const h = document.getElementById('fundHint');
      if(h) h.textContent = '已更新（'+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'）· 盘中为实时估值，收盘后显示官方净值';
      return;
    }
    const f = list[i++];
    const s = document.createElement('script');
    window.jsonpgz = function(d){
      try{
        f.prevNav = parseFloat(d.dwjz) || f.prevNav;   // 上一交易日净值
        f.nav = parseFloat(d.gsz) || f.nav;            // 盘中实时估值
        if(!f.name) f.name = d.name;
        f.gztime = d.gztime;
      }catch(e){}
    };
    s.onload = function(){ setTimeout(next, 100); };
    s.onerror = function(){ next(); };
    s.src = 'https://fundgz.1234567.com.cn/js/'+f.code+'.js?rt='+Date.now();
    document.head.appendChild(s);
    setTimeout(()=>{ if(s.parentNode) s.parentNode.removeChild(s); }, 5000);
  }
  next();
}
function sendChat(){
  const v = gv('chatIn'); if(!v) return;
  db.fundChat.push({id:uid(),date:today(),role:'user',text:v});
  // 简单解析：买入/卖出 + 名称 + 金额
  let reply = '已记录 ✓';
  const m = v.match(/(买入|卖出|加仓|减仓)\s*(\S+?)\s*(\d+(?:\.\d+)?)\s*(元|份)?/);
  if(m){
    const [,act,name,amt,unit] = m;
    const f = db.funds.find(x=>x.name.includes(name)||x.code===name);
    if(f){
      const n = parseFloat(amt);
      const shares = unit==='份' ? n : n/(f.nav||1);
      if(act==='买入'||act==='加仓'){
        const totalCost = f.cost*f.shares + n*(unit==='份'?f.nav:1);
        f.shares += shares; f.cost = f.shares? totalCost/f.shares : f.cost;
        reply = `已记录买入「${f.name}」${unit==='份'?n+'份':n+'元（约'+shares.toFixed(2)+'份）'}，现持有 ${f.shares.toFixed(2)} 份，成本 ${f.cost.toFixed(4)} ✓`;
      }else{
        f.shares = Math.max(0, f.shares - shares);
        reply = `已记录卖出「${f.name}」${unit==='份'?n+'份':n+'元'}，剩余 ${f.shares.toFixed(2)} 份 ✓`;
      }
    }else reply = `未找到「${name}」基金，可先在上方添加持仓，本次仅记录文字 ✓`;
  }
  db.fundChat.push({id:uid(),date:today(),role:'bot',text:reply});
  save(); renderFund();
}

/* ---------- 9. 我的财务 ---------- */
function renderFinance(){
  const d = today();
  const month = d.slice(0,7);
  const mList = db.finance.filter(f=>f.date.slice(0,7)===month);
  const inSum = mList.filter(f=>f.type==='in').reduce((s,f)=>s+f.amount,0);
  const outSum = mList.filter(f=>f.type==='out').reduce((s,f)=>s+f.amount,0);
  // 近14天趋势
  const days = [], ins = [], outs = [];
  for(let i=13;i>=0;i--){
    const dd = new Date(); dd.setDate(dd.getDate()-i);
    const ds = dd.toISOString().slice(0,10);
    days.push((dd.getMonth()+1)+'/'+dd.getDate());
    ins.push(db.finance.filter(f=>f.date===ds&&f.type==='in').reduce((s,f)=>s+f.amount,0));
    outs.push(db.finance.filter(f=>f.date===ds&&f.type==='out').reduce((s,f)=>s+f.amount,0));
  }
  // 支出分类
  const cats = {};
  mList.filter(f=>f.type==='out').forEach(f=>cats[f.cat]=(cats[f.cat]||0)+f.amount);
  const catArr = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const recent = [...db.finance].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  main.innerHTML = headHTML('💰 我的财务', `${month} 月度概览`) + `
    <div class="card">
      <div class="stat-row">
        <div class="stat"><div class="s-num" style="color:var(--danger)">¥${inSum.toFixed(2)}</div><div class="s-label">本月收入</div></div>
        <div class="stat"><div class="s-num" style="color:var(--ok)">¥${outSum.toFixed(2)}</div><div class="s-label">本月支出</div></div>
        <div class="stat"><div class="s-num">¥${(inSum-outSum).toFixed(2)}</div><div class="s-label">结余</div></div>
      </div>
      <button class="btn primary" style="width:100%;justify-content:center;margin-top:12px" onclick="editFin()">+ 记一笔</button>
    </div>
    <div class="card">
      <div class="card-title"><h3>近 14 天收支趋势</h3></div>
      <div class="chart-box">${lineChart(days, ins, outs)}</div>
      <div class="legend"><span><i style="background:#f5483b"></i>收入</span><span><i style="background:#18a058"></i>支出</span></div>
    </div>
    <div class="card">
      <div class="card-title"><h3>本月支出分类</h3></div>
      ${catArr.length?catArr.map(([c,v])=>`
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span>${esc(c)}</span><span>¥${v.toFixed(2)} · ${Math.round(v/outSum*100)}%</span></div>
          <div class="progress"><i style="width:${Math.round(v/outSum*100)}%;background:linear-gradient(90deg,#18a058,#4ade80)"></i></div>
        </div>`).join(''):'<div class="empty">本月暂无支出记录</div>'}
    </div>
    <div class="card">
      <div class="card-title"><h3>最近记录</h3></div>
      ${recent.length?recent.map(f=>`
        <div class="list-item">
          <span style="font-size:18px">${f.type==='in'?'💵':'💸'}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px">${esc(f.note||f.cat)}</div>
            <div style="font-size:11px;color:var(--sub)">${f.date} · ${esc(f.cat)}</div>
          </div>
          <span class="${f.type==='in'?'fund-up':'fund-down'}" style="font-size:14px">${f.type==='in'?'+':'-'}¥${f.amount.toFixed(2)}</span>
          <button class="btn sm danger" onclick="delFin('${f.id}')">删</button>
        </div>`).join(''):'<div class="empty">暂无记录</div>'}
    </div>`;
}
function lineChart(labels, s1, s2){
  const W = Math.max(560, labels.length*44), H = 170, P = 28;
  const max = Math.max(...s1, ...s2, 10);
  const x = i => P + i*(W-2*P)/(labels.length-1);
  const y = v => H - P - v/max*(H-2*P);
  const pts = s => s.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    ${[0,.5,1].map(t=>`<line x1="${P}" y1="${y(max*t)}" x2="${W-P}" y2="${y(max*t)}" stroke="#eef0f4"/>
      <text x="${P-4}" y="${y(max*t)+3}" font-size="9" fill="#a0a4ad" text-anchor="end">${Math.round(max*t)}</text>`).join('')}
    <polyline points="${pts(s1)}" fill="none" stroke="#f5483b" stroke-width="2"/>
    <polyline points="${pts(s2)}" fill="none" stroke="#18a058" stroke-width="2"/>
    ${s1.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#f5483b"/>`).join('')}
    ${s2.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#18a058"/>`).join('')}
    ${labels.map((l,i)=>i%2===0?`<text x="${x(i)}" y="${H-6}" font-size="9" fill="#a0a4ad" text-anchor="middle">${l}</text>`:'').join('')}
  </svg>`;
}
const FIN_CATS = {in:['工资','奖金','理财','报销','其他收入'], out:['餐饮','交通','购物','住房','娱乐','学习','医疗','其他支出']};
function editFin(){
  openModal('记一笔', `
    <div class="form-row"><label>类型</label><div class="seg" id="mTypeSeg">
      <button class="on" data-t="out" onclick="finTypePick(this)">支出</button>
      <button data-t="in" onclick="finTypePick(this)">收入</button></div>
      <input type="hidden" id="mType" value="out"></div>
    <div class="form-row"><label>金额（元）</label><input type="number" step="0.01" id="mAmt" placeholder="0.00"></div>
    <div class="form-row"><label>分类</label><select id="mCat">${FIN_CATS.out.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="form-row"><label>备注</label><input type="text" id="mNote" placeholder="选填"></div>
    <div class="form-row"><label>日期</label><input type="date" id="mDate" value="${today()}"></div>
  `, ()=>{
    const amt = parseFloat(document.getElementById('mAmt').value);
    if(!amt || amt<=0){alert('请输入有效金额');return false;}
    db.finance.push({id:uid(),type:document.getElementById('mType').value,amount:amt,
      cat:document.getElementById('mCat').value,note:gv('mNote'),date:document.getElementById('mDate').value||today()});
    save(); renderFinance();
  });
}
function finTypePick(btn){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const t = btn.dataset.t;
  document.getElementById('mType').value = t;
  document.getElementById('mCat').innerHTML = FIN_CATS[t].map(c=>`<option>${c}</option>`).join('');
}
function delFin(id){ if(!confirm('删除这条记录？')) return; db.finance=db.finance.filter(x=>x.id!==id); save(); renderFinance(); }

/* ================= 工具 ================= */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= 启动 ================= */
renderNav(); render();
</script>
